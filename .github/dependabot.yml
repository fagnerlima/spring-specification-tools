version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns:
          - org.apache.maven.plugins:*
          - org.codehaus.mojo:*
          - org.sonatype.central:*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
